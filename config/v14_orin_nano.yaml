# ==============================================================================
# reBot Arm B601-DM + Orbbec Gemini 305 — Jetson Orin Nano 8GB 专属配置
# （config/v14_orin_nano.yaml）
# ==============================================================================
# 目标硬件：NVIDIA Jetson Orin Nano 8GB 开发套件（标准 15W / Super 25W / MAXN_SUPER）
#           6 核 Cortex-A78AE + 8GB 统一内存 + JetPack 6.x (Ubuntu 22.04, Python 3.10)
#
# 针对 Orin Nano 8GB 的专项系统与算力优化：
#   1. 640×480 @ 30fps + ROI 0.60 + CPU XNNPACK：在 6 核 A78AE 上 CPU 占用 < 55%，
#      为 200Hz 达妙 MIT 控制线程与 100Hz PBVS 伺服留足实时余量，15W/25W 均零掉帧；
#   2. cv_num_threads=2：严格限制 OpenCV 内部线程池，防止 6 核抢占 200Hz 控制线程；
#   3. 8GB 统一内存友好：diag_queue_size=2048（降低队列内存与 SD/NVMe 写入峰值）；
#   4. 30fps 延迟对齐：pose_delay_s=0.032s 匹配 30fps 帧间隔，卡曼速度预测保持丝滑跟随；
#   5. Orin Nano Super 25W 高频进阶档（推荐尝试）：
#      启动时附加 `--fps 60 --detect-stride 2` → 60fps 相机采样 + 每 2 帧跑一次 MediaPipe
#      + 间隔帧由 <0.5ms LK 光流桥接，实现「60Hz 有效视觉更新 + 30Hz 算力消耗」！
#   6. 全部 B601-DM 硬件安全红线 100% 保持严格不变（distance=0.35m, depth 0.07~1.20m,
#      workspace_max_radius=0.42m, max_vel<=0.85m/s, J2/J3<=2.0 rad/s）。
# ==============================================================================

v14:
  ctrl_rate_hz: 100.0

  estimator:
    pose_delay_s: 0.032             # 适配 30fps 视觉帧间隔的端到端延迟补偿
    pose_lpf_tau_s: 0.014
    kf_q: 1.80
    kf_r_xy: 0.0023
    kf_r_z: 0.0038
    kf_resync_frames: 3
    kf_static_q_scale: 0.65
    axis_adapt_enable: true
    axis_adapt_ref_xy: 0.032
    axis_adapt_ref_z: 0.080
    axis_adapt_max_xy: 1.75
    axis_adapt_max_z: 1.00
    axis_adapt_confirm: 2
    axis_adapt_attack_tau: 0.030
    axis_adapt_release_tau: 0.100
    target_stale_s: 0.14            # 适配 30fps（33ms/帧），容忍 3~4 帧短时波动
    lead_base_ms: 10.0
    lead_max_ms: 18.0
    lead_near_dist: 0.025
    lead_full_dist: 0.046
    lead_dir_full_cos: 0.45
    lead_attack_tau: 0.028
    lead_release_tau: 0.012

  fsm:
    deadband_in_m: 0.020
    deadband_hysteresis: 1.70
    vel_deadband_off: 0.060
    vel_deadband_on: 0.130
    exit_confirm_s: 0.050
    stop_confirm_s: 0.080
    docking_dist_m: 0.065
    fast_start_enable: true
    fast_start_frames: 2
    fast_start_dist: 0.028
    fast_start_dir_cos: 0.80
    post_brake_settle_s: 0.16
    post_brake_ext_extra_s: 0.06
    coast_window_s: 0.12
    lost_hold_s: 0.30

  pbvs:
    distance: 0.35
    servo_direction: 1.0
    gain: 2.55                      # 30fps 下略微收敛增益防相位滞后过冲
    gain_x: 2.05
    far_gain_boost: 0.35
    world_ff_gain: 0.58
    ff_max_vel: 0.90
    ff_taper_dist: 0.085
    ff_taper_max_dist: 0.135
    ff_taper_speed_ref: 0.35
    smooth_alpha: 0.48
    max_accel: 4.00
    reversal_accel_boost: 2.00
    reversal_residual_scale: 0.18
    coast_decay_per20ms: 0.90
    coast_max_vel: 0.35
    static_vel_hold_enable: true
    static_vel_hold_speed: 0.060
    static_vel_hold_delay_s: 0.030
    reach_soft_start: 0.24
    reach_soft_end: 0.38
    reach_min_scale: 0.70
    reach_dock_dist: 0.25
    reach_ff_min_scale: 0.65
    reach_lead_min_scale: 0.30
    reach_accel_min_scale: 0.75
    reach_att_tau: 0.15
    reach_release_tau: 0.04
    k_orientation: 1.60
    orientation_deadband_deg: 2.0
    ori_cruise_weight_min: 0.80
    ori_soft_max_deg: 10.0
    osc_damp_enable: true
    osc_err_thresh: 0.018
    osc_min_half_s: 0.14
    osc_max_half_s: 0.42
    osc_gain_cut: 0.30
    osc_decay_tau_s: 0.55
    osc_confirm_reversals: 3
    osc_large_err_release: 0.15

  safety:
    max_vel: 0.85
    max_vel_angular: 2.00
    max_vel_joint_dock: 2.00
    max_vel_joints: [2.50, 2.00, 2.00, 3.00, 3.00, 2.40]
    joint_vel_grouped_cruise: true
    joint_limit_cushion_rad: 0.08
    damping_base: 0.010
    damping_adaptive: true
    manipulability_threshold: 0.004
    min_manip_speed_scale: 0.35
    hard_wall_margin_m: 0.05
    workspace_min: [-0.40, -0.35, 0.04]
    workspace_max: [ 0.42,  0.35, 0.62]
    workspace_max_radius: 0.42

  depth:
    min_valid_m: 0.07
    max_valid_m: 1.20
    max_jump_m: 0.08
    max_rate_m: 0.05
    reacq_frames: 4                 # 30fps 下 4 帧约 133ms 重捕获
    reacq_tol_m: 0.06
    reacq_bg_margin_m: 0.25
    anti_lock_frames: 12
    z_freeze_max_s: 0.22
    oe_min_cutoff: 0.80
    oe_beta: 0.42

  camera:
    width: 640
    height: 480
    fps: 30                         # Orin Nano 8GB 黄金稳态档；Super 25W 可加 --fps 60 --detect-stride 2
    color_exposure_ms: 6.0
    force_zero_distortion: true
    hw_timestamp_enable: false
    hw_max_transport_s: 0.20
    roi_crop_enable: true
    roi_crop_scale: 0.60            # 紧致 ROI 显著降低 ARM64 MediaPipe 单帧耗时
    detector_backend: "cpu"         # 避免无头 Orin Nano 触发 EGL/GLES GPU delegate 报错
    detect_stride: 1                # 30fps 默认逐帧检测；60fps 建议设为 2（间隔帧走 LK 光流）
    cv_num_threads: 2               # 限制 OpenCV 线程数，为 200Hz MIT + 100Hz PBVS 预留 CPU 核
    hybrid_track_enable: true
    hybrid_max_frames: 12
    hybrid_box_half: 48
    hybrid_max_step_px: 105
    diag_enable: true
    diag_queue_size: 2048           # 8GB RAM 轻量日志队列

  sim:
    mit_hz: 200.0
    kp: [120.0, 120.0, 120.0, 18.0, 18.0, 18.0]
    kd_near: [8.0, 8.0, 8.0, 2.0, 2.0, 2.0]
    kd_far:  [11.0, 10.0, 10.0, 2.0, 2.0, 2.0]
    j_eff: [0.150, 0.310, 0.420, 0.060, 0.018, 0.035]
    j1_ext_coeff: 0.75
    vel_ff_scale: [0.70, 0.85, 0.85, 0.85, 0.85, 0.85]
    gravity_ff_scale: [0.0, 0.55, 0.65, 0.65, 0.0, 0.0]
    viscous_friction: [0.40, 1.10, 1.25, 0.25, 0.15, 0.15]
    transport_delay_s: 0.005
    dq_noise_std: 0.035
    camera_delay_s: 0.032
    tau_limit_nm: [15.0, 21.0, 21.0, 5.2, 5.2, 5.2]
    track_err_limit_deg: 12.0
